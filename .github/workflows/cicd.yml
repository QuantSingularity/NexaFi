name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1 -- Code Quality Checks
  # ============================================================
  code_quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python formatters
        run: |
          python -m pip install --upgrade pip
          python -m pip install autoflake black==25.11.0

      - name: Check Python Code Quality
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Running autoflake check ==="
          autoflake --remove-all-unused-imports --remove-unused-variables --recursive --check .

          echo "=== Running black check ==="
          black . --check

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Global Formatters
        run: npm install -g prettier prettier-plugin-solidity

      - name: Run Global Quality Check
        shell: bash
        run: |
          set -euo pipefail
          NODE_GLOBAL=$(npm root -g)
          echo "=== Running Prettier check for all supported files ==="
          prettier --plugin="$NODE_GLOBAL/prettier-plugin-solidity/dist/index.js" \
            --check "**/*.{js,jsx,ts,tsx,json,html,css,md,sol,yml,yaml}"

      - name: Quality checks complete
        run: echo "All formatting and quality checks passed."

  # ============================================================
  # Job 2 -- Backend Tests
  # ============================================================
  backend_tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: code_quality

    env:
      BACKEND_DIR: code/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: code/backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f "${BACKEND_DIR}/requirements.txt" ]; then
            python -m pip install -r "${BACKEND_DIR}/requirements.txt"
          fi
          python -m pip install pytest pytest-cov pytest-asyncio

      - name: Run backend test suite
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --tb=short \
            --strict-markers \
            -v \
            --cov=. \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: ${{ env.BACKEND_DIR }}/coverage.xml
          retention-days: 30

  # ============================================================
  # Job 3 -- Backend Build
  # ============================================================
  backend_build:
    name: Backend Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: backend_tests
    timeout-minutes: 25

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            context: code/backend
            dockerfile: code/backend/api-gateway/Dockerfile
            health_path: /health
          - service: auth-service
            context: code/backend
            dockerfile: code/backend/auth-service/Dockerfile
            health_path: /api/v1/health
          - service: compliance-service
            context: code/backend
            dockerfile: code/backend/compliance-service/Dockerfile
            health_path: /api/v1/health
          - service: credit-service
            context: code/backend
            dockerfile: code/backend/credit-service/Dockerfile
            health_path: /api/v1/health
          - service: document-service
            context: code/backend
            dockerfile: code/backend/document-service/Dockerfile
            health_path: /api/v1/health
          - service: ledger-service
            context: code/backend
            dockerfile: code/backend/ledger-service/Dockerfile
            health_path: /api/v1/health
          - service: notification-service
            context: code/backend
            dockerfile: code/backend/notification-service/Dockerfile
            health_path: /api/v1/health
          - service: open-banking-gateway
            context: code/backend
            dockerfile: code/backend/open-banking-gateway/Dockerfile
            health_path: /api/v1/health
          - service: payment-service
            context: code/backend
            dockerfile: code/backend/payment-service/Dockerfile
            health_path: /api/v1/health
          - service: user-service
            context: code/backend
            dockerfile: code/backend/user-service/Dockerfile
            health_path: /api/v1/health
          - service: ai-service
            context: code
            dockerfile: code/ml_services/ai-service/Dockerfile
            health_path: /api/v1/health
          - service: analytics-service
            context: code
            dockerfile: code/ml_services/analytics-service/Dockerfile
            health_path: /api/v1/health

    env:
      IMAGE: nexafi/${{ matrix.service }}:ci-${{ github.sha }}
      CONTAINER: nexafi-ci-${{ matrix.service }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Smoke test container
        shell: bash
        env:
          HEALTH_PATH: ${{ matrix.health_path }}
        run: |
          set -euo pipefail
          docker image ls "$IMAGE"
          port=$(docker image inspect "$IMAGE" --format '{{json .Config.ExposedPorts}}' | jq -r 'keys[0]' | cut -d/ -f1)
          docker run -d --name "$CONTAINER" \
            -p "127.0.0.1:${port}:${port}" \
            -e SECRET_KEY=ci-smoke-secret-key-with-sufficient-length \
            -e JWT_SECRET_KEY=ci-smoke-secret-key-with-sufficient-length \
            -e DATABASE_URL=sqlite:////tmp/ci.db \
            "$IMAGE"
          for attempt in $(seq 1 45); do
            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER")" != "true" ]; then
              echo "Container exited before becoming healthy"
              docker logs "$CONTAINER"
              exit 1
            fi
            if curl -fsS "http://127.0.0.1:${port}${HEALTH_PATH}" > /dev/null; then
              echo "Healthy on port ${port} after ${attempt} checks"
              exit 0
            fi
            sleep 2
          done
          echo "Health check did not pass in time"
          docker logs "$CONTAINER"
          exit 1

      - name: Remove container
        if: always()
        run: docker rm -f "$CONTAINER" || true

  # ============================================================
  # Job 4 -- Web Build
  # ============================================================
  web_build:
    name: Web Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: web-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web-frontend
        run: CI=false npm run build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web-frontend/dist/
          retention-days: 7
