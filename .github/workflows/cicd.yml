name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1 -- Code Quality Checks
  # ============================================================
  code_quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python formatters
        run: |
          python -m pip install --upgrade pip
          python -m pip install autoflake black==25.11.0

      - name: Check Python Code Quality
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Running autoflake check ==="
          autoflake --remove-all-unused-imports --remove-unused-variables --recursive --check .

          echo "=== Running black check ==="
          black . --check

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Global Formatters
        run: npm install -g prettier prettier-plugin-solidity

      - name: Run Global Quality Check
        shell: bash
        run: |
          set -euo pipefail
          NODE_GLOBAL=$(npm root -g)
          echo "=== Running Prettier check for all supported files ==="
          prettier --plugin="$NODE_GLOBAL/prettier-plugin-solidity/dist/index.js" \
            --check "**/*.{js,jsx,ts,tsx,json,html,css,md,sol,yml,yaml}"

      - name: Quality checks complete
        run: echo "All formatting and quality checks passed."

  # ============================================================
  # Job 2 -- Backend Tests
  # ============================================================
  backend_tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: code_quality

    env:
      BACKEND_DIR: code/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: code/backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f "${BACKEND_DIR}/requirements.txt" ]; then
            python -m pip install -r "${BACKEND_DIR}/requirements.txt"
          fi
          python -m pip install pytest pytest-cov pytest-asyncio

      - name: Run backend test suite
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --tb=short \
            --strict-markers \
            -v \
            --cov=. \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: ${{ env.BACKEND_DIR }}/coverage.xml
          retention-days: 30

  # ============================================================
  # Job 3 -- Backend Build (all services in one job)
  # ============================================================
  backend_build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: backend_tests
    timeout-minutes: 60

    permissions:
      contents: read

    env:
      IMAGE_TAG: ci-${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub runtime for build cache
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Build and smoke test all services
        shell: bash
        run: |
          set -uo pipefail

          SERVICES=(
            "api-gateway|code/backend|code/backend/api-gateway/Dockerfile|/health"
            "auth-service|code/backend|code/backend/auth-service/Dockerfile|/api/v1/health"
            "compliance-service|code/backend|code/backend/compliance-service/Dockerfile|/api/v1/health"
            "credit-service|code/backend|code/backend/credit-service/Dockerfile|/api/v1/health"
            "document-service|code/backend|code/backend/document-service/Dockerfile|/api/v1/health"
            "ledger-service|code/backend|code/backend/ledger-service/Dockerfile|/api/v1/health"
            "notification-service|code/backend|code/backend/notification-service/Dockerfile|/api/v1/health"
            "open-banking-gateway|code/backend|code/backend/open-banking-gateway/Dockerfile|/api/v1/health"
            "payment-service|code/backend|code/backend/payment-service/Dockerfile|/api/v1/health"
            "user-service|code/backend|code/backend/user-service/Dockerfile|/api/v1/health"
            "ai-service|code|code/ml_services/ai-service/Dockerfile|/api/v1/health"
            "analytics-service|code|code/ml_services/analytics-service/Dockerfile|/api/v1/health"
          )

          build_image() {
            local service="$1" context="$2" dockerfile="$3" image="$4"
            docker buildx build \
              --load \
              --tag "$image" \
              --file "$dockerfile" \
              --cache-from "type=gha,scope=${service}" \
              --cache-to "type=gha,mode=max,scope=${service}" \
              "$context"
          }

          smoke_test() {
            local service="$1" image="$2" health_path="$3"
            local container="nexafi-ci-${service}"
            local port result=1 exited=0

            docker image ls "$image"
            port=$(docker image inspect "$image" --format '{{json .Config.ExposedPorts}}' | jq -r 'keys[0]' | cut -d/ -f1) || return 1

            docker run -d --name "$container" \
              -p "127.0.0.1:${port}:${port}" \
              -e SECRET_KEY=ci-smoke-secret-key-with-sufficient-length \
              -e JWT_SECRET_KEY=ci-smoke-secret-key-with-sufficient-length \
              -e DATABASE_URL=sqlite:////tmp/ci.db \
              "$image" || return 1

            for attempt in $(seq 1 45); do
              if [ "$(docker inspect -f '{{.State.Running}}' "$container")" != "true" ]; then
                echo "Container exited before becoming healthy"
                exited=1
                break
              fi
              if curl -fsS "http://127.0.0.1:${port}${health_path}" > /dev/null; then
                echo "Healthy on port ${port} after ${attempt} checks"
                result=0
                break
              fi
              sleep 2
            done

            if [ "$result" -ne 0 ]; then
              if [ "$exited" -eq 0 ]; then
                echo "Health check did not pass in time"
              fi
              docker logs "$container"
            fi

            docker rm -f "$container" > /dev/null 2>&1 || true
            return "$result"
          }

          failed=()
          passed=()

          for entry in "${SERVICES[@]}"; do
            IFS='|' read -r service context dockerfile health_path <<< "$entry"
            image="nexafi/${service}:${IMAGE_TAG}"

            echo "::group::Build ${service}"
            if build_image "$service" "$context" "$dockerfile" "$image"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::Build failed for ${service}"
              failed+=("${service} (build)")
              continue
            fi

            echo "::group::Smoke test ${service}"
            if smoke_test "$service" "$image" "$health_path"; then
              echo "::endgroup::"
              passed+=("$service")
            else
              echo "::endgroup::"
              echo "::error::Smoke test failed for ${service}"
              failed+=("${service} (smoke test)")
            fi

            docker image rm -f "$image" > /dev/null 2>&1 || true
          done

          echo "=== Summary ==="
          echo "Passed: ${#passed[@]}"
          for item in "${passed[@]}"; do
            echo "  ok      ${item}"
          done
          echo "Failed: ${#failed[@]}"
          for item in "${failed[@]}"; do
            echo "  FAILED  ${item}"
          done

          if [ "${#failed[@]}" -gt 0 ]; then
            exit 1
          fi

      - name: Remove leftover containers
        if: always()
        run: docker ps -aq --filter "name=nexafi-ci-" | xargs -r docker rm -f

  # ============================================================
  # Job 4 -- Web Frontend Build
  # ============================================================
  web-frontend_build:
    name: Web-Frontend Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: web-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web-frontend
        run: CI=false npm run build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web-frontend/dist/
          retention-days: 7
